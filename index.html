<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Special Letter For You 💌</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-anim { animation: shake 0.35s ease-in-out; }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-100 via-rose-50 to-purple-100 flex flex-col items-center justify-center p-4 selection:bg-rose-200">

  <!-- Top bar with Admin Button -->
  <header class="w-full max-w-sm sm:max-w-md flex justify-between items-center mb-4 px-2">
    <div class="flex items-center gap-2 text-xs font-semibold text-gray-500 bg-white/70 px-3 py-1.5 rounded-full shadow-sm">
      <i class="fa-solid fa-lock text-rose-400"></i>
      <span>Protected Cards</span>
    </div>
    <button onclick="promptAdmin()" class="text-xs font-semibold text-rose-600 hover:text-rose-700 transition flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/80 hover:bg-white shadow-sm">
      <i class="fa-solid fa-gear text-xs"></i>
      <span>Manage Cards</span>
    </button>
  </header>

  <!-- Main Card -->
  <main class="w-full max-w-sm sm:max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border border-white/60 p-6 sm:p-8 transition-all">
    
    <!-- Lock Screen -->
    <div id="lockView" class="space-y-6 text-center">
      <div class="w-16 h-16 bg-rose-50 rounded-2xl mx-auto flex items-center justify-center shadow-inner text-rose-500 text-3xl">
        <i class="fa-solid fa-envelope-open-text"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-gray-800">You've Got a Secret Note</h1>
        <p class="text-sm text-gray-500 mt-1">Enter your private passcode to unlock your letter.</p>
      </div>

      <form onsubmit="handleUnlock(event)" class="space-y-3">
        <div>
          <input 
            type="password" 
            id="codeInput" 
            placeholder="ENTER YOUR PASSCODE" 
            autocomplete="off"
            class="w-full px-4 py-3.5 text-center text-lg font-bold tracking-widest text-gray-800 bg-gray-50 border-2 border-gray-200 rounded-2xl focus:border-rose-400 focus:bg-white focus:outline-none transition-all uppercase placeholder:normal-case placeholder:tracking-normal placeholder:font-normal placeholder:text-gray-400 placeholder:text-sm"
          />
        </div>
        <button 
          type="submit" 
          class="w-full py-3.5 bg-rose-500 hover:bg-rose-600 active:scale-[0.98] text-white font-semibold rounded-2xl shadow-lg shadow-rose-200 transition-all flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-heart text-xs"></i>
          <span>Open My Message</span>
        </button>
      </form>

      <p id="errorMsg" class="text-xs font-semibold text-rose-600 hidden"></p>
    </div>

    <!-- Unlocked View -->
    <div id="unlockedView" class="hidden space-y-5 text-center fade-in">
      <div class="w-14 h-14 bg-rose-100 rounded-full mx-auto flex items-center justify-center text-rose-500 text-2xl shadow-inner">
        <i class="fa-solid fa-heart"></i>
      </div>
      
      <div>
        <span class="text-xs font-bold tracking-widest text-rose-400 uppercase">Personal Message</span>
        <h2 id="cardRecipient" class="text-2xl font-extrabold text-gray-800 mt-0.5"></h2>
      </div>

      <div class="bg-gradient-to-b from-rose-50/70 to-pink-50/60 rounded-2xl p-5 sm:p-6 border border-rose-100 text-left shadow-sm max-h-[60vh] overflow-y-auto">
        <p id="cardBody" class="text-gray-700 leading-relaxed whitespace-pre-line text-sm sm:text-base font-normal"></p>
      </div>

      <button onclick="lockAgain()" class="text-xs font-semibold text-gray-400 hover:text-gray-600 underline">
        Lock Message
      </button>
    </div>
  </main>

  <!-- Admin Modal (Unlocked with ROOPALOVE) -->
  <div id="adminModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm sm:max-w-md w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto space-y-4">
      <div class="flex justify-between items-center pb-2 border-b">
        <h3 class="font-bold text-gray-800 text-lg">Card Manager</h3>
        <button onclick="closeAdmin()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <form onsubmit="handleSaveCard(event)" class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-500">Friend's Name</label>
          <input type="text" id="adminName" required class="w-full px-3 py-2 border rounded-xl text-sm" placeholder="e.g. Priya" />
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Secret Passcode</label>
          <input type="text" id="adminPass" required class="w-full px-3 py-2 border rounded-xl text-sm uppercase" placeholder="e.g. PASS123" />
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Message</label>
          <textarea id="adminMsg" required rows="4" class="w-full px-3 py-2 border rounded-xl text-sm" placeholder="Write letter..."></textarea>
        </div>
        <button type="submit" class="w-full py-2.5 bg-rose-500 text-white rounded-xl text-sm font-semibold hover:bg-rose-600 transition">
          Save Card
        </button>
      </form>

      <div class="pt-3 border-t">
        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Configured Friends</h4>
        <div id="cardsList" class="space-y-2 max-h-40 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASS = "ROOPALOVE";

    const DEFAULT_CARDS = {
      "BESTIE2426": {
        name: "Shrey",
        message: "Thanks to you, Bae ❤️\n\nPeople say boys will come and go, but what's between besties stays forever—I truly believe this line. Well, to say about the days we spent, they were so incredible, funny, loving, and all lifetime memories. You have been with me always. The talks we share and the time we spend together are really amazing.\n\nI want you to be a part of every moment in my life. I will always be there for you no matter what—what's crazy is I'll stand by you even if it's your mistake! Whenever you feel like having a person to talk to about anything, you can remember me; without judging you, I'll listen to you for sure.\n\nI hope we stay together like this always and create the best version of our lives. There is lots to say, but yeah, love you as always. Soon we will meet da!"
      },
      "GANESH_GOOD_BOY": {
        name: "Ganesh",
        message: "Hey guy, wassup! 👋\n\nI have never met a person like you in my life... Yeah, I know you are saying \"Of course!\" 😂\n\nJokes apart, they were lovely days, spending incredible time together. To say about you: you are such a well-behaved and interesting person. You give value to every relationship, which is what I love the most. You have been there most of the time—we spent wonderful days and had deep conversations at night that mean a lot to me.\n\nThank you for being you; your presence makes everything more happy and enjoyable. Hope we stay together always, just as we are now.\n\nMeet you soon, byeeee!"
      },
      "CHIRU2429": {
        name: "Chiru Avre",
        message: "En heli devru nim bagge, you have become the most important person in my life ❤️\n\nI enjoy every single day being with you. I adore all the days we have spent together. You are such a very good friend and lovable person—truly one of the most good-hearted people I've ever met in my life.\n\nYalla almost helidhini nimige, but I still want to spend more time and a good life together. I will always be there for you; whenever you need me, I'm right here. That sweet voice of yours and your calm nature always melts me.\n\nThank you so much for understanding me and being there for me. I love you so much (heart emoji imagine madi ❤️)!"
      }
    };

    function getCards() {
      const stored = localStorage.getItem("custom_friend_cards");
      return stored ? JSON.parse(stored) : DEFAULT_CARDS;
    }

    function saveCards(data) {
      localStorage.setItem("custom_friend_cards", JSON.stringify(data));
    }

    function handleUnlock(e) {
      e.preventDefault();
      const input = document.getElementById("codeInput");
      const err = document.getElementById("errorMsg");
      const code = input.value.trim().toUpperCase();

      if (!code) return;

      const cards = getCards();

      if (cards[code]) {
        err.classList.add("hidden");
        document.getElementById("lockView").classList.add("hidden");
        document.getElementById("unlockedView").classList.remove("hidden");
        
        document.getElementById("cardRecipient").textContent = "Dear " + cards[code].name + ",";
        document.getElementById("cardBody").textContent = cards[code].message;

        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      } else {
        err.textContent = "Passcode not recognized. Check your code and try again!";
        err.classList.remove("hidden");
        input.parentElement.classList.add("shake-anim");
        setTimeout(() => input.parentElement.classList.remove("shake-anim"), 350);
      }
    }

    function lockAgain() {
      document.getElementById("codeInput").value = "";
      document.getElementById("unlockedView").classList.add("hidden");
      document.getElementById("lockView").classList.remove("hidden");
    }

    function promptAdmin() {
      const pin = prompt("Enter Master Admin Password:");
      if (!pin) return;
      if (pin.trim() === ADMIN_PASS) {
        renderAdminList();
        document.getElementById("adminModal").classList.remove("hidden");
      } else {
        alert("Access Denied: Incorrect Admin Password!");
      }
    }

    function closeAdmin() {
      document.getElementById("adminModal").classList.add("hidden");
    }

    function renderAdminList() {
      const list = document.getElementById("cardsList");
      const cards = getCards();
      const keys = Object.keys(cards);
      
      if (keys.length === 0) {
        list.innerHTML = `<p class="text-xs text-gray-400">No cards stored.</p>`;
        return;
      }

      list.innerHTML = keys.map(k => `
        <div class="flex items-center justify-between p-2 bg-gray-50 border rounded-xl text-xs">
          <div>
            <span class="font-bold text-gray-800">${cards[k].name}</span>
            <span class="text-gray-400 font-mono ml-2">(${k})</span>
          </div>
          <button onclick="deleteCard('${k}')" class="text-rose-500 hover:text-rose-700 font-semibold px-2">Delete</button>
        </div>
      `).join('');
    }

    function handleSaveCard(e) {
      e.preventDefault();
      const name = document.getElementById("adminName").value.trim();
      const pass = document.getElementById("adminPass").value.trim().toUpperCase();
      const msg = document.getElementById("adminMsg").value.trim();

      const cards = getCards();
      cards[pass] = { name, message: msg };
      saveCards(cards);

      document.getElementById("adminName").value = "";
      document.getElementById("adminPass").value = "";
      document.getElementById("adminMsg").value = "";
      renderAdminList();
      alert("Card saved successfully!");
    }

    function deleteCard(key) {
      if (!confirm("Are you sure you want to delete this card?")) return;
      const cards = getCards();
      delete cards[key];
      saveCards(cards);
      renderAdminList();
    }
  </script>
</body>
</html>
